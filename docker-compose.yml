version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=your-production-secret-change-this
      - DATABASE_PATH=/app/backend/data/database.sqlite
      - UPLOAD_DIR=/app/backend/uploads
    volumes:
      - snapselect-data:/app/backend/data
      - snapselect-uploads:/app/backend/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - snapselect-uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  snapselect-data:
  snapselect-uploads:
