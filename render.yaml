services:
  # Combined Backend + Frontend (backend serves frontend in production)
  - type: web
    name: snapselect
    env: node
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./backend/database.sqlite
      - key: UPLOAD_DIR
        value: ./backend/uploads
    healthCheckPath: /api/health
